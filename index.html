<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6840d8">
<title>ذكرني</title>
<style>
:root{--purple:#6840d8;--purple2:#8b68ed;--ink:#30234f;--muted:#8c82a5;--bg:#f4f0ff;--line:#e7e0f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.app{max-width:520px;min-height:100vh;margin:auto;padding:0 15px 30px;background:linear-gradient(180deg,#f4efff,#fbfaff 60%,#f1edff)}
.top{margin:0 -15px;padding:23px 18px 18px;min-height:112px;text-align:center;color:white;border-radius:0 0 28px 28px;background:radial-gradient(circle at 15% 15%,#ffffff35,transparent 30%),linear-gradient(135deg,#4d27db,#7b4be9 58%,#9b75f2);box-shadow:0 8px 24px #5b39c738}
.brand{font-size:31px;font-weight:bold}.brand .bell{font-size:27px;margin-left:7px}.tagline{font-size:12px;color:#eee8ff;margin-top:5px}
.date-panel{margin:14px 0 15px;padding:14px 13px;display:flex;align-items:center;justify-content:space-around;gap:8px;border:1px solid #e3dafd;border-radius:19px;background:#ffffffed;box-shadow:0 5px 17px #583ea41a}
.date-copy,.time-copy{min-width:0;flex:1;text-align:center}.date-label{display:block;color:#8b7bb5;font-size:10px;margin-bottom:5px}
#date{font-size:11px;line-height:1.6;color:#544779}.date-divider{width:1px;height:42px;background:#e5def6}
.clock{font-size:29px;line-height:1.1;color:#6037d7;font-weight:bold}.clock-mark{font-size:30px;color:#8b6be9}
.welcome{margin:0 0 20px;padding:17px 16px;display:flex;align-items:center;gap:12px;border:1px solid #e6dcff;border-radius:20px;background:linear-gradient(110deg,#eee6ff,#fff 70%);box-shadow:0 5px 16px #583ea414}
.welcome-mark{flex:0 0 48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#7e55e9,#512bd0);color:white;font-size:26px}
.welcome h2{font-size:17px;margin:0 0 6px;color:#35245f}.welcome p{font-size:11px;line-height:1.7;color:#766b91;margin:0}
.section-title{font-size:16px;color:#392765;margin:22px 2px 13px;font-weight:bold}.section-title small{display:block;font-size:10px;color:#9588b1;font-weight:normal;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:139px;padding:15px 13px 18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(155deg,#fff,#fbf9ff);color:var(--ink);text-align:right;box-shadow:0 5px 15px #50379117;cursor:pointer;font-family:inherit}
.tile:active{transform:scale(.975)}.symbol{width:52px;height:52px;border-radius:17px;margin-bottom:10px;background:#eee8ff;color:#7048dd;display:grid;place-items:center;font-size:27px}
.tile:nth-child(4n+2) .symbol{background:#ffe9ed;color:#e45c79}.tile:nth-child(4n+3) .symbol{background:#e4f6ef;color:#299d77}.tile:nth-child(4n+4) .symbol{background:#fff1d9;color:#d99629}
.tile strong{display:block;font-size:13px;margin-bottom:5px}.tile small{font-size:10px;color:#9185aa}.tile:after{content:"🎙";position:absolute;left:11px;bottom:11px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#f0eaff;font-size:15px}
.panel{display:none;margin-top:18px;padding:18px;border-radius:20px;background:white;border:1px solid var(--line);box-shadow:0 6px 20px #50379114}.panel.active{display:block}.panel h3{margin:0 0 8px;color:#4c2d9e;font-size:19px}
.muted{color:var(--muted);font-size:12px;line-height:1.7}.back{margin-bottom:14px}
button{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#7046df,#8b65ee);color:white;font-weight:bold;font-family:inherit;cursor:pointer}
button.secondary{background:#eee8fb;color:#5d439c}button.danger{background:#c94c70}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.entry{padding:12px;margin:9px 0;border-radius:13px;background:#faf8ff;border:1px solid #e8e1f6;font-size:13px}
.entry audio{width:100%;margin-top:9px}.entry .meta{font-size:11px;color:var(--muted);margin-top:5px}
input{display:block;width:100%;padding:13px;margin:10px 0;border-radius:11px;border:1px solid #ded5f3;background:#faf8ff;color:var(--ink);font-family:inherit;font-size:14px}
.sound-note{margin:12px 0;padding:11px;border-radius:12px;background:#f2edff;color:#7145d9;font-size:12px;font-weight:bold}
.record-status{margin-top:10px;font-size:12px;color:#7659bd;min-height:18px}
.footer{text-align:center;margin-top:28px;color:#a096b7;font-size:11px}
#alarmOverlay{display:none;position:fixed;inset:0;background:#271454e8;z-index:10;align-items:center;justify-content:center;padding:20px}
.alarmCard{width:100%;max-width:380px;background:white;color:var(--ink);padding:28px;border-radius:23px;text-align:center;box-shadow:0 15px 40px #0003}
.alarmCard h2{color:#7046df}.alarmCard p{font-size:18px}
@media(max-width:370px){.app{padding-left:11px;padding-right:11px}.top{margin-left:-11px;margin-right:-11px}.tile{min-height:132px}.date-copy #date{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span class="bell">🔔</span>ذَكِّرني</div><div class="tagline">مساعدك الشخصي لتنظيم حياتك</div></header>
<section class="date-panel" aria-label="الوقت والتاريخ"><div class="date-copy"><span class="date-label">اليوم والتاريخ</span><div id="date"></div></div><div class="date-divider"></div><div class="time-copy"><span class="date-label">الوقت الآن</span><div class="clock" id="clock">00:00</div></div><span class="clock-mark">◷</span></section>
<section class="welcome"><div class="welcome-mark">✦</div><div><h2>مرحباً بك في ذكرني</h2><p>سجّل معلوماتك بصوتك واحتفظ بها في مكان واحد.</p></div></section>
<div id="home">
<div class="section-title">أقسام التطبيق <small>اضغط على القسم لتسجيل معلومتك بصوتك</small></div>
<div class="grid">
<button class="tile" onclick="openSection('reminders')"><span class="symbol">◷</span><strong>التذكيرات والمواعيد</strong><small>مواعيدك المهمة وتنبيهاتك</small></button>
<button class="tile" onclick="openSection('health')"><span class="symbol">✚</span><strong>الأدوية والصحة</strong><small>معلوماتك الصحية والدواء</small></button>
<button class="tile" onclick="openSection('people')"><span class="symbol">♙</span><strong>الأشخاص ومعلوماتهم</strong><small>أسماء ومعلومات الأشخاص</small></button>
<button class="tile" onclick="openSection('files')"><span class="symbol">▤</span><strong>الصور والملفات</strong><small>ملاحظاتك الصوتية عن ملفاتك</small></button>
<button class="tile" onclick="openSection('audio')"><span class="symbol">♫</span><strong>التسجيلات الصوتية</strong><small>كل تسجيلاتك المحفوظة</small></button>
<button class="tile" onclick="openSection('future')"><span class="symbol">✉</span><strong>رسائل المستقبل</strong><small>رسائل تسجلها لنفسك</small></button>
<button class="tile" onclick="openSection('business')"><span class="symbol">▦</span><strong>التجار والحسابات</strong><small>بياناتك التجارية والحسابات</small></button>
<button class="tile" onclick="openSection('worship')"><span class="symbol">☾</span><strong>الأذكار والعبادات</strong><small>أذكارك وتذكيراتك اليومية</small></button>
</div></div>
<div id="panels"></div>
<div class="footer">ذكرني • معلوماتك وذكرياتك في مكان واحد</div>
</div>
<div id="alarmOverlay"><div class="alarmCard"><h2>🔔 انتبه</h2><p id="alarmText"></p><button class="danger" onclick="stopAlarm()">إيقاف التنبيه</button></div></div>
<script>
const sections=[
{id:"reminders",title:"التذكيرات والمواعيد",desc:"سجّل التذكير بصوتك وحدد موعد التنبيه."},
{id:"health",title:"الأدوية والصحة",desc:"سجّل اسم الدواء أو المعلومة الصحية بصوتك."},
{id:"people",title:"الأشخاص ومعلوماتهم",desc:"سجّل اسم الشخص والمعلومات التي تريد تذكرها."},
{id:"files",title:"الصور والملفات",desc:"سجّل ملاحظة صوتية مرتبطة بملف أو صورة."},
{id:"audio",title:"التسجيلات الصوتية",desc:"مساحة لجميع تسجيلاتك الصوتية."},
{id:"future",title:"رسائل المستقبل",desc:"سجّل رسالة صوتية وحدد تاريخ تذكيرك بها."},
{id:"business",title:"التجار والحسابات",desc:"سجّل بيانات التاجر أو الحساب بصوتك."},
{id:"worship",title:"الأذكار والعبادات",desc:"سجّل الذكر أو العبادة التي تريد تذكرها."}
];
const panels=document.getElementById("panels");
panels.innerHTML=sections.map(s=>`<section class="panel" id="${s.id}"><button class="secondary back" onclick="goHome()">رجوع</button><h3>${s.title}</h3><p class="muted">${s.desc}</p>${s.id==="reminders"||s.id==="future"?`<input id="${s.id}Title" placeholder="عنوان مختصر للتسجيل"><label class="muted">موعد التذكير</label><input id="${s.id}Time" type="datetime-local">`:s.id==="files"?`<input id="fileTitle" placeholder="اسم الملف أو الصورة (اختياري)">`:`<input id="${s.id}Title" placeholder="عنوان التسجيل (اختياري)">`}<div class="sound-note">🎙 اضغط بدء التسجيل وتحدث؛ سيتم حفظ صوتك نفسه وليس تحويله إلى نص.</div><div class="actions"><button id="${s.id}Start" onclick="startRecording('${s.id}')">● بدء التسجيل</button><button class="danger" id="${s.id}Stop" onclick="stopRecording()" disabled>إيقاف وحفظ</button></div><div class="record-status" id="${s.id}Status"></div><div id="${s.id}List"></div></section>`).join("");
function openSection(id){document.getElementById("home").style.display="none";document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");renderRecords(id)}
function goHome(){if(recorder&&recorder.state==="recording")stopRecording();document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.getElementById("home").style.display="block"}
function updateClock(){const n=new Date();document.getElementById("clock").textContent=n.toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});document.getElementById("date").textContent=n.toLocaleDateString("ar",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}updateClock();setInterval(updateClock,1000);
let db,recorder=null,chunks=[],activeSection=null,activeStream=null,alarmTimer=null,alarmInterval=null,audioCtx=null;
function openDB(){return new Promise((resolve,reject)=>{if(db)return resolve(db);const req=indexedDB.open("ZakkerniVoiceRecords",1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains("records"))d.createObjectStore("records",{keyPath:"id",autoIncrement:true})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>reject(req.error)})}
async function startRecording(section){try{if(recorder&&recorder.state==="recording")return;await openDB();activeSection=section;activeStream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(activeStream);recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});const title=document.getElementById(section+"Title")?.value.trim()||"تسجيل صوتي";const time=document.getElementById(section+"Time")?.value||"";const fileTitle=document.getElementById("fileTitle")?.value.trim()||"";const tx=db.transaction("records","readwrite");tx.objectStore("records").add({section,title,time,fileTitle,blob,createdAt:new Date().toISOString()});tx.oncomplete=()=>{document.getElementById(section+"Status").textContent="تم حفظ التسجيل الصوتي بنجاح.";renderRecords(section)};activeStream?.getTracks().forEach(t=>t.stop());activeStream=null;document.getElementById(section+"Start").disabled=false;document.getElementById(section+"Stop").disabled=true};recorder.start();document.getElementById(section+"Start").disabled=true;document.getElementById(section+"Stop").disabled=false;document.getElementById(section+"Status").textContent="جارٍ التسجيل الآن..."}catch(e){alert("تعذر بدء التسجيل. اسمح باستخدام الميكروفون وافتح التطبيق عبر HTTPS.")}}
function stopRecording(){if(recorder&&recorder.state!=="inactive")recorder.stop()}
async function renderRecords(section){try{await openDB();const tx=db.transaction("records","readonly");const req=tx.objectStore("records").getAll();req.onsuccess=()=>{const list=document.getElementById(section+"List");if(!list)return;list.innerHTML="";req.result.filter(r=>r.section===section).sort((a,b)=>b.id-a.id).forEach(r=>{const url=URL.createObjectURL(r.blob);const el=document.createElement("div");el.className="entry";const title=document.createElement("strong");title.textContent=r.title+(r.fileTitle?" • "+r.fileTitle:"");const meta=document.createElement("div");meta.className="meta";meta.textContent=new Date(r.createdAt).toLocaleString("ar");el.append(title,meta);if(r.time){const t=document.createElement("div");t.className="meta";t.textContent="موعد التذكير: "+new Date(r.time).toLocaleString("ar");el.append(t)}const audio=document.createElement("audio");audio.controls=true;audio.src=url;el.append(audio);const del=document.createElement("button");del.className="danger";del.style.marginTop="8px";del.textContent="حذف التسجيل";del.onclick=()=>deleteRecord(r.id,section);el.append(del);list.append(el)})}}catch(e){console.error(e)}}
async function deleteRecord(id,section){await openDB();const tx=db.transaction("records","readwrite");tx.objectStore("records").delete(id);tx.oncomplete=()=>renderRecords(section)}
async function loadAllReminders(){await openDB();const tx=db.transaction("records","readonly");const req=tx.objectStore("records").getAll();req.onsuccess=()=>{req.result.filter(r=>r.time&&new Date(r.time).getTime()>Date.now()).forEach(r=>{const delay=new Date(r.time).getTime()-Date.now();setTimeout(()=>showAlarm(r.title),delay)})}}
function showAlarm(title){document.getElementById("alarmText").textContent=title||"لديك تذكير";document.getElementById("alarmOverlay").style.display="flex";playAttention();alarmInterval=setInterval(playAttention,1500);if("Notification"in window&&Notification.permission==="granted")new Notification("انتبه",{body:title||"لديك تذكير"})}
function playAttention(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==="suspended")audioCtx.resume();[[880,0],[660,.25],[990,.52]].forEach(([freq,offset])=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime+offset);gain.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+offset+.025);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+offset+.22);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+offset);osc.stop(audioCtx.currentTime+offset+.24)})}catch(e){}}
function stopAlarm(){clearInterval(alarmInterval);document.getElementById("alarmOverlay").style.display="none"}
document.addEventListener("click",()=>{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().catch(()=>{})},{once:true});
loadAllReminders();
</script>
</body>
</html>
