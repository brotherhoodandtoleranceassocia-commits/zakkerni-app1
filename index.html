
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذكرني</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee8ff;font-family:Tahoma,Arial}
.app{position:relative;width:100%;max-width:691px;margin:auto}
.design{width:100%;display:block}
button{position:absolute;border:0;background:transparent;
border-radius:50%;cursor:pointer}
#reminders{left:20%;top:45%;width:22%;height:8%}
#medicine{left:69%;top:45%;width:22%;height:8%}
#people{left:20%;top:63%;width:22%;height:8%}
#files{left:69%;top:63%;width:22%;height:8%}
#notes{left:42%;top:81%;width:22%;height:8%}
#settings{left:32%;top:92%;width:18%;height:6%}
#log{left:55%;top:92%;width:18%;height:6%}
#home{left:78%;top:92%;width:18%;height:6%}
#about{left:5%;top:92%;width:18%;height:6%}
.panel{
display:none;position:fixed;z-index:5;bottom:3%;left:4%;
width:92%;max-height:75vh;overflow:auto;
background:white;border-radius:22px;padding:20px;
box-shadow:0 5px 25px #5555;text-align:center;
}
.panel h2{color:#5015c9}
.panel button.action{
position:static;background:#5719d5;color:white;
border:0;border-radius:12px;padding:12px;margin:6px;
font-size:16px;width:auto;height:auto
}
.panel button.close{background:#eee;color:#333}
.record{padding:12px;border-bottom:1px solid #ddd}
audio{width:100%}
</style>
</head>
<body>

<div class="app">
<img class="design" src="design.png" alt="ذكرني">

<button id="reminders"></button>
<button id="medicine"></button>
<button id="people"></button>
<button id="files"></button>
<button id="notes"></button>
<button id="settings"></button>
<button id="log"></button>
<button id="home"></button>
<button id="about"></button>
</div>

<div class="panel" id="panel">
<h2 id="heading">ذكرني</h2>
<p>تحدث الآن لحفظ معلوماتك بصوتك</p>
<button class="action" id="start">🎙️ بدء التسجيل</button>
<button class="action" id="stop" disabled>إيقاف وحفظ</button>
<div id="recordings"></div>
<button class="action close" id="close">إغلاق</button>
</div>

<script>
const names={
reminders:"التذكيرات",
medicine:"مواعيد الأدوية",
people:"الأشخاص",
files:"الملفات والصور",
notes:"الملاحظات",
settings:"الإعدادات",
log:"السجل",
about:"حول التطبيق"
};

let category="";
let recorder=null;
let chunks=[];
let stream=null;

const panel=document.getElementById("panel");
const heading=document.getElementById("heading");

const DB="ZakkerniDatabase";

function database(){
return new Promise((resolve,reject)=>{
let request=indexedDB.open(DB,1);
request.onupgradeneeded=()=>{
request.result.createObjectStore("audio",
{keyPath:"id",autoIncrement:true});
};
request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
}

async function save(blob){
let db=await database();
let tx=db.transaction("audio","readwrite");
tx.objectStore("audio").add({
category:category,
blob:blob,
date:new Date().toLocaleString("ar")
});
tx.oncomplete=loadRecordings;
}

async function loadRecordings(){
let db=await database();
let tx=db.transaction("audio","readonly");
let request=tx.objectStore("audio").getAll();

request.onsuccess=()=>{
let box=document.getElementById("recordings");
box.innerHTML="<h3>التسجيلات المحفوظة</h3>";

request.result
.filter(x=>x.category===category)
.forEach(x=>{
let div=document.createElement("div");
div.className="record";

let date=document.createElement("p");
date.textContent=x.date;

let audio=document.createElement("audio");
audio.controls=true;
audio.src=URL.createObjectURL(x.blob);

let del=document.createElement("button");
del.className="action";
del.textContent="حذف";
del.onclick=async()=>{
let db=await database();
db.transaction("audio","readwrite")
.objectStore("audio").delete(x.id);
div.remove();
};

div.append(date,audio,del);
box.appendChild(div);
});
};
}

function openSection(id){
category=id;
heading.textContent=names[id];
panel.style.display="block";
loadRecordings();
}

Object.keys(names).forEach(id=>{
document.getElementById(id).onclick=()=>{
if(id==="home"){
panel.style.display="none";
return;
}
openSection(id);
};
});

document.getElementById("start").onclick=async()=>{
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
chunks=[];
recorder=new MediaRecorder(stream);

recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

recorder.onstart=()=>{
document.getElementById("start").disabled=true;
document.getElementById("stop").disabled=false;
};

recorder.start();
}catch(e){
alert("يرجى السماح باستخدام الميكروفون");
}
};

document.getElementById("stop").onclick=()=>{
if(!recorder)return;
recorder.onstop=async()=>{
await save(new Blob(chunks,{type:recorder.mimeType}));
stream.getTracks().forEach(t=>t.stop());
document.getElementById("start").disabled=false;
document.getElementById("stop").disabled=true;
alert("تم حفظ التسجيل الصوتي");
};
recorder.stop();
};

document.getElementById("close").onclick=()=>{
panel.style.display="none";
};
</script>
</body>
</html>
